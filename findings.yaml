# MP108 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G179"          # your group id, e.g. "G042"
problem_id: "MP108"

data_issues:
  # For each of the 7 kinds: present: true or false.
  # If present is false, leave the other values as null.
  leaking_column:
    present: false
    column: null           # the column that must not be used as a feature
  unit_mixup:
    present: true
    column: "distance_to_hospital_km"           # the column recorded in a different unit
    group_value: "Old Town"      # the value of locality whose rows are affected
    factor: 1000           # wrong value = right value x factor
  sentinel_value:
    present: true
    column: "nearby_clinics"
    value: 9999            # the special number typed instead of a blank
    count: 60            # how many rows have it
  duplicate_rows:
    present: true
    count: 26            # number of EXTRA copies (rows you would delete)
  stuck_sensor:
    present: true
    column: "flu_cases_reported"
    start_date: "2026-03-15"       # first date with the stuck value, YYYY-MM-DD
    end_date: "2026-04-04"         # last date with the stuck value, YYYY-MM-DD
  target_typos:
    present: false
    count: null            # rows whose target was typed 10 times too big
  spelling_variants:
    present: false
    column: null
    true_levels: null      # how many real categories there are after cleaning

tracking:
  experiment_name: null
  best_run_id: null        # the MLflow run id of your v1 model
  registered_model_name: null
  champion_version: null

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    flu_cases_reported: null
    temp_c: null
    nearby_clinics: null
    discount_pct: null
    stock_lines: null
    distance_to_hospital_km: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of locality
    'Old Town': null
    'New Town': null
    'Cantonment': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
